name: Implement resume overlay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-resume-overlay.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portfolio index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_tag = '<link rel="stylesheet" href="assets/resume-overlay.css">'
          js_tag = '<script src="assets/resume-overlay.js"></script>'

          if css_tag not in s:
              s = s.replace('</head>', css_tag + '\n</head>', 1)
          if js_tag not in s:
              s = s.replace('</body>', js_tag + '\n</body>', 1)

          s = s.replace(
              '<meta property="og:title" content="Julien M. Soriano | Virtual Assistant & Support Professional">',
              '<meta property="og:title" content="Julien M. Soriano | Virtual Assistant & Healthcare Support">'
          )
          s = s.replace(
              '<meta name="twitter:title" content="Julien M. Soriano | Virtual Assistant & Support Professional">',
              '<meta name="twitter:title" content="Julien M. Soriano | Virtual Assistant & Healthcare Support">'
          )

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Integrate visual resume overlay"
            git push
          fi
